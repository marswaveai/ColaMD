appId: ai.marswave.colamd
productName: ColaMD
copyright: Copyright © 2024-2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: resources/templates
    to: templates
  - from: resources/demo
    to: demo

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: txt
    name: Text Document
    role: Editor
    mimeType: text/plain

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - nsis
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  # No spaces: the default "${productName} Setup ${version}.exe" gets sanitized
  # two different ways (latest.yml: space -> "-", GitHub asset: space -> "."),
  # so the updater requested a filename that never existed on the release
  # (ColaMD-Setup-2.0.0.exe vs ColaMD.Setup.2.0.0.exe) and every in-app update
  # on Windows failed with a silent 404 (#56).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: marswaveai
  repo: ColaMD
