appId: ai.marswave.colamd
productName: ColaMD
copyright: Copyright © 2024-2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  # All runtime JavaScript is bundled by electron-vite. Do not let
  # electron-builder copy the complete production dependency tree into app.asar.
  - '!node_modules/**/*'

asar:
  # The packaged app has no native modules. Avoid builder's broad automatic
  # unpacking heuristics and keep the archive self-contained.
  smartUnpack: false

# ColaMD provides its own Chinese/English UI and only needs these Chromium
# locale resources. Keeping every Electron locale adds tens of megabytes.
# Electron uses hyphens on Linux and underscores in macOS .lproj names.
electronLanguages:
  - en-US
  - en_US
  - zh-CN
  - zh_CN

extraResources:
  - from: resources/templates
    to: templates
  - from: resources/demo
    to: demo

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: txt
    name: Text Document
    role: Editor
    mimeType: text/plain

mac:
  compression: maximum
  # Publish separate installers for each CPU architecture instead of a
  # universal binary. This keeps both Intel and Apple Silicon support while
  # avoiding the duplicated Electron framework in every download.
  artifactName: '${productName}-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - nsis
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  # No spaces: the default "${productName} Setup ${version}.exe" gets sanitized
  # two different ways (latest.yml: space -> "-", GitHub asset: space -> "."),
  # so the updater requested a filename that never existed on the release
  # (ColaMD-Setup-2.0.0.exe vs ColaMD.Setup.2.0.0.exe) and every in-app update
  # on Windows failed with a silent 404 (#56).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: marswaveai
  repo: ColaMD
