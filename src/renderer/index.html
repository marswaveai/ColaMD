<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http: file:;">
  <title>ColaMD</title>
  <!-- Keep the titlebar stable before the renderer CSS bundle loads. -->
  <style>
    #titlebar { height: 40px; position: relative; -webkit-app-region: drag; }
    #titlebar > button, #agent-dot { position: absolute; -webkit-app-region: no-drag; }
    #titlebar > button { border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; }
    #word-count, #source-toggle-btn, #file-toggle-btn { top: 6px; width: 28px; height: 28px; }
    #word-count { right: 32px; }
    #source-toggle-btn { right: 68px; }
    #file-toggle-btn { right: 104px; }
    #agent-dot { top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: rgba(127, 127, 127, 0.3); }
    #title-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 300px); display: flex; align-items: center; gap: 8px; pointer-events: none; }
    #file-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; pointer-events: none; }
    #save-status { flex-shrink: 0; font-size: 11px; line-height: 1.3; color: rgba(127, 127, 127, 0.9); opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
    .toolbar-tip { position: absolute; opacity: 0; pointer-events: none; }
    #editor { height: calc(100vh - 40px); }
    #source-editor { display: none; }
  </style>
</head>
<body>
  <div id="titlebar">
    <div id="title-center">
      <span id="file-title">未命名</span>
      <span id="save-status" aria-live="polite"></span>
    </div>
    <div id="agent-dot" aria-label="Agent 状态">
      <span class="toolbar-tip">Agent 状态</span>
    </div>
    <button id="word-count" aria-label="文档统计">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="4.5" y1="6" x2="11.5" y2="6"/>
        <line x1="4.5" y1="9" x2="9.5" y2="9"/>
      </svg>
      <span class="toolbar-tip word-count-tip">0 字 · 0 词 · 0 段</span>
    </button>
    <button id="source-toggle-btn" aria-label="切换 Markdown 源码 / 所见即所得">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5.5 4.5 2 8 5.5 11.5"/>
        <polyline points="10.5 4.5 14 8 10.5 11.5"/>
      </svg>
      <span class="toolbar-tip">切换 Markdown 源码 / 所见即所得</span>
    </button>
    <button id="file-toggle-btn" aria-label="显示 / 隐藏文件列表">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="5.3" y1="3" x2="5.3" y2="13"/>
      </svg>
      <span class="toolbar-tip">显示 / 隐藏文件列表 (⌘⇧B)</span>
    </button>
  </div>
  <aside id="file-panel" hidden>
    <div class="file-panel-tabs" role="tablist" aria-label="侧栏内容">
      <button id="file-panel-files" class="active" type="button" role="tab" aria-selected="true">文件</button>
      <button id="file-panel-outline" type="button" role="tab" aria-selected="false">大纲</button>
    </div>
    <ul id="file-list"></ul>
    <ul id="outline-list" hidden></ul>
  </aside>
  <div id="panel-resizer" aria-hidden="true"></div>
  <div id="editor"></div>
  <textarea id="source-editor" spellcheck="false"></textarea>
  <div id="image-migrate-banner" hidden>
    <span id="image-migrate-text">检测到内嵌 Base64 图片</span>
    <button id="image-migrate-action" type="button">提取为本地文件</button>
    <button id="image-migrate-dismiss" type="button" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>
  <div id="update-banner" hidden>
    <span id="update-banner-text">发现新版本</span>
    <button id="update-banner-action" type="button">更新</button>
    <button id="update-banner-dismiss" type="button" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
