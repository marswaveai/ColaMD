<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http: file:;">
  <title>ColaMD</title>
  <!-- Keep the titlebar stable before the renderer CSS bundle loads. -->
  <style>
    #titlebar { height: 40px; position: relative; z-index: 30; -webkit-app-region: drag; }
    #titlebar > button { position: absolute; -webkit-app-region: no-drag; }
    #titlebar > button, #title-center > button { border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; }
    #word-count, #source-toggle-btn, #file-toggle-btn, #new-tab-btn { top: 6px; width: 28px; height: 28px; }
    #word-count { right: 6px; }
    #source-toggle-btn { right: 42px; }
    #file-toggle-btn { right: 78px; }
    #new-tab-btn { right: 114px; }
    #title-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 400px); display: flex; align-items: center; pointer-events: none; }
    #file-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; pointer-events: auto; -webkit-app-region: no-drag; cursor: default; }
    #reveal-file-btn { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); -webkit-app-region: no-drag; width: 28px; height: 28px; }
    #save-status { position: absolute; left: calc(100% + 44px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 11px; line-height: 1.3; opacity: 0; pointer-events: none; }
    .toolbar-tip { position: absolute; opacity: 0; pointer-events: none; }
    #file-panel { width: var(--file-panel-width, 220px); }
    #file-panel-resizer { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; -webkit-app-region: no-drag; }
    #source-editor { display: none; }
  </style>
</head>
<body>
  <div id="titlebar">
    <div id="title-center">
      <span id="file-title">未命名</span>
      <button id="reveal-file-btn" type="button" disabled aria-label="打开所在文件夹">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.33 5 7.4a1.33 1.33 0 0 1 1.16-.73h7.33a1.33 1.33 0 0 1 1.29 1.67l-1.03 4a1.33 1.33 0 0 1-1.3 1H2.67a1.33 1.33 0 0 1-1.33-1.33V3.33A1.33 1.33 0 0 1 2.67 2h2.6a1.33 1.33 0 0 1 1.13.6l.54.8a1.33 1.33 0 0 0 1.11.6H12a1.33 1.33 0 0 1 1.33 1.33v1.33"/>
        </svg>
        <span class="toolbar-tip">打开所在文件夹</span>
      </button>
      <span id="save-status" aria-live="polite"></span>
    </div>
    <button id="word-count" aria-label="文档统计">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="4.5" y1="6" x2="11.5" y2="6"/>
        <line x1="4.5" y1="9" x2="9.5" y2="9"/>
      </svg>
      <span class="toolbar-tip word-count-tip">0 字 · 0 词 · 0 段</span>
    </button>
    <button id="source-toggle-btn" aria-label="切换 Markdown 源码 / 所见即所得">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5.5 4.5 2 8 5.5 11.5"/>
        <polyline points="10.5 4.5 14 8 10.5 11.5"/>
      </svg>
      <span class="toolbar-tip">切换 Markdown 源码 / 所见即所得</span>
    </button>
    <button id="new-tab-btn" aria-label="新建标签页">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="3.5" x2="8" y2="12.5"/>
        <line x1="3.5" y1="8" x2="12.5" y2="8"/>
      </svg>
      <span class="toolbar-tip">新建标签页 (⌘T)</span>
    </button>
    <button id="file-toggle-btn" aria-label="显示 / 隐藏文件列表">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <line x1="5.3" y1="3" x2="5.3" y2="13"/>
      </svg>
      <span class="toolbar-tip">显示 / 隐藏文件列表 (⌘⇧B)</span>
    </button>
  </div>
  <div id="tab-bar">
    <div id="tab-list"></div>
    <button id="tab-more-btn" aria-label="更多标签页" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" stroke="none">
        <circle cx="3.2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.8" cy="8" r="1.4"/>
      </svg>
    </button>
  </div>
  <aside id="file-panel" hidden>
    <div class="file-panel-tabs" role="tablist" aria-label="侧栏内容">
      <button id="file-panel-files" class="active" type="button" role="tab" aria-selected="true">文件</button>
      <button id="file-panel-outline" type="button" role="tab" aria-selected="false">大纲</button>
    </div>
    <ul id="file-list"></ul>
    <ul id="outline-list" hidden></ul>
  </aside>
  <div id="panel-resizer" aria-hidden="true"></div>
  <div id="editor"></div>
  <textarea id="source-editor" spellcheck="false"></textarea>
  <div id="update-banner" hidden>
    <span id="update-banner-text">发现新版本</span>
    <button id="update-banner-action" type="button">更新</button>
    <button id="update-banner-dismiss" type="button" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
