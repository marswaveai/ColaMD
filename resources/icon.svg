<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="0.58" stop-color="#f0ebe5"/>
      <stop offset="1" stop-color="#e5ded7"/>
    </linearGradient>
    <linearGradient id="cola" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e56846"/>
      <stop offset="0.52" stop-color="#c84a30"/>
      <stop offset="1" stop-color="#a93827"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset="0.5" stop-color="#f5eadb"/>
      <stop offset="1" stop-color="#fff9ef"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6d6258" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6b261b" flood-opacity="0.26"/>
    </filter>
    <clipPath id="paperClip">
      <rect x="36" y="36" width="952" height="952" rx="226"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="218" y="218" width="588" height="588" rx="82"/>
    </clipPath>
  </defs>

  <!-- macOS app icon tile; the outside corners remain transparent. -->
  <rect x="36" y="36" width="952" height="952" rx="226" fill="url(#paper)" filter="url(#paperShadow)"/>

  <g clip-path="url(#paperClip)" fill="none" stroke="#d8d0c8" stroke-width="3" stroke-linecap="round" opacity="0.52">
    <path d="M106 310H918"/>
    <path d="M106 410H918"/>
    <path d="M106 510H918"/>
    <path d="M106 610H918"/>
    <path d="M106 710H918"/>
  </g>

  <!-- The Cola mark is intentionally a square for stronger Dock-size recognition. -->
  <rect x="218" y="218" width="588" height="588" rx="82" fill="url(#cola)" filter="url(#cardShadow)"/>
  <path d="M160 512C270 420 382 420 512 512C642 604 754 604 864 512" fill="none" stroke="url(#wave)" stroke-width="28" stroke-linecap="round" clip-path="url(#cardClip)"/>
</svg>
